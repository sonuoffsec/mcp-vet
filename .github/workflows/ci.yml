name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # ubuntu-latest has no prebuilt Python 3.9 (end of life), so pin an older image for it.
          - os: ubuntu-24.04
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests (includes the recall suite)
        run: python -m unittest discover -s tests -v
      - name: Print recall table
        run: python tests/test_recall.py
      - name: The scanner must find nothing in its own source
        env:
          PYTHONPATH: src
        run: python -m mcp_vet src

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel and run it
        run: |
          python -m pip install dist/*.whl
          mcp-vet --version
          mcp-vet examples/safe-server
      - name: The vulnerable example must still fail the gate
        run: |
          if mcp-vet examples/vulnerable-server --fail-on HIGH > /dev/null; then
            echo "vulnerable example passed the gate, which means detection broke" >&2
            exit 1
          fi

  action:
    name: The GitHub Action works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: A clean server passes
        uses: ./
        with:
          path: examples/safe-server
          package: "."
      - name: A vulnerable server must fail the gate
        id: vulnerable
        uses: ./
        continue-on-error: true
        with:
          path: examples/vulnerable-server
          package: "."
          sarif-file: vulnerable.sarif
      - name: Check the gate failed and SARIF was written
        env:
          OUTCOME: ${{ steps.vulnerable.outcome }}
        run: |
          test "$OUTCOME" = "failure" || { echo "the vulnerable example did not fail the gate ($OUTCOME)" >&2; exit 1; }
          test -s vulnerable.sarif
