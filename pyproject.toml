[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-vet"
version = "0.1.0"
description = "Static security scanner for MCP (Model Context Protocol) servers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "llm-security", "ai-security", "prompt-injection", "tool-poisoning", "sast"]
dependencies = []

[project.scripts]
mcp-vet = "mcp_vet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
